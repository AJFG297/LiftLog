appId: com.ajfg297.liftlog
---
# Routines tab -> Add plan (opens straight into the new plan)
- launchApp
# A cold dev-client launch can take up to a minute to fetch the bundle from Metro
- extendedWaitUntil:
    visible: 'Home'
    timeout: 60000
- tapOn: 'Routines'
- tapOn: 'Add plan'

# Add a workout, which opens into the workout editor
- assertVisible: 'Add workout'
- tapOn: 'Add workout'

# Add an exercise, which opens into the exercise editor
- assertVisible: 'Add exercise'
- tapOn: 'Add exercise'

# Drop reps 10 -> 9, raise sets 3 -> 4.
# Sets and reps share child testIDs and sit side by side, so pick by render
# order: sets is index 0, reps is index 1.
- assertVisible: 'Weighted'
- tapOn:
    id: 'fixed-decrement'
    index: 1
- tapOn:
    id: 'fixed-increment'
    index: 0

# Enable superset (further down the form, so scroll to it).
# On Android the switch is a native Expo UI element with no testID, so tap the
# row (its label toggles the switch) rather than the switch itself.
- scrollUntilVisible:
    element:
      text: 'Superset next exercise'
    direction: DOWN
- tapOn: 'Superset next exercise'

# A new exercise has no rules. The first one added moves weight; narrow it to the lowest sets via the
# scope dropdown, then add a second: a weight rule never hands over, so the new rung goes in front of
# it and the pair comes out as reps-then-weight without any further editing.
- scrollUntilVisible:
    element:
      id: 'progression-add-rule'
    direction: DOWN
- tapOn:
    id: 'progression-add-rule'
- scrollUntilVisible:
    element:
      text: 'Amount to increase'
    direction: DOWN
- scrollUntilVisible:
    element:
      text: 'Every set'
    direction: DOWN
- tapOn: 'Every set'
- tapOn: 'Every lowest'

- scrollUntilVisible:
    element:
      id: 'progression-add-rule'
    direction: DOWN
- tapOn:
    id: 'progression-add-rule'
- assertVisible: 'Stop at a limit'

# Back to the workout; the exercise persisted
- back
- assertVisible: 'Exercise 1'

# Reopen it and confirm every edit was saved
- tapOn: 'Exercise 1'
# The two value inputs hold different numbers, so id + text identifies each
- assertVisible:
    id: 'fixed-value-input'
    text: '9'
- assertVisible:
    id: 'fixed-value-input'
    text: '4'
- scrollUntilVisible:
    element:
      text: 'Superset next exercise'
    direction: DOWN
- assertVisible:
    checked: true
    rightOf: 'Superset next exercise'
# Rule 1 is the reps rung added above and rule 2 the original weight rule, so both survived in order
- scrollUntilVisible:
    element:
      text: 'Rule 2'
    direction: DOWN
- assertVisible: 'Limit'
# Rule 2's own scope, which is the narrowing made before it was pushed down the list
- scrollUntilVisible:
    element:
      text: 'Every lowest'
    direction: DOWN

# Back out and remove the plan so the flow leaves no state behind. The plan editor sits on the You
# tab's settings stack, so backing out of it lands on You; the plan list is the Routines tab.
- back
- back
- back
- tapOn: 'Routines'
# Each plan's more button is named for its plan. Picking one by position (rightOf the name) can land
# on another plan's button, which removes the wrong plan.
- tapOn: 'More for New plan'
- tapOn: 'Remove'
- assertVisible: 'Plan deleted'
- assertNotVisible: 'New plan'
