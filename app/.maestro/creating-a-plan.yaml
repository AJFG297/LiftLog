appId: com.ajfg297.liftlog
---
# Settings tab -> Manage plans (the Routines screen) -> New program, which opens the program page
- launchApp
# A cold dev-client launch can take up to a minute to fetch the bundle from Metro
- extendedWaitUntil:
    visible: 'Workout'
    timeout: 60000
- tapOn: 'Settings'
- tapOn: 'Manage plans'
- assertVisible: 'Routines'
- scrollUntilVisible:
    element:
      id: 'routines-new-program'
    direction: DOWN
- tapOn:
    id: 'routines-new-program'

# A new routine opens straight into the routine editor, empty, with its four starts
- tapOn:
    id: 'program-add-routine'
- assertVisible: 'New routine'
- assertVisible: 'How do you want to start?'
- tapOn:
    id: 'routine-name'
- inputText: 'E2E Push'
- hideKeyboard

# Pick two exercises in one go. They're added 3 x 10 in the order they were tapped, and the first opens
# expanded
- tapOn:
    id: 'routine-start-pick'
- tapOn:
    id: 'exercise-search-input'
- inputText: 'Standing Military Press'
- tapOn:
    id: 'exercise-picker-row-Standing Military Press'
- tapOn:
    id: 'exercise-search-clear'
- inputText: 'Barbell Bench Press'
- tapOn:
    id: 'exercise-picker-row-Barbell Bench Press - Medium Grip'
- assertVisible: 'Add 2 exercises'
- tapOn:
    id: 'exercise-picker-add'

# Set the first exercise's first set to 8 reps on the number pad, go to the next set, then hide the pad
- tapOn:
    id: 'routine-set-reps-working-0'
- tapOn: '8'
- tapOn: 'Next field'
- tapOn: 'Hide keypad'
- assertVisible: '8'

# Superset it with the one after it
- tapOn:
    id: 'routine-exercise-superset'
- assertVisible: 'Superset A'

# Save, and the routine is in the program
- tapOn:
    id: 'routine-save'
- assertVisible: 'E2E Push'

# Back out to the Routines screen and remove the program so the flow leaves no state behind
- back
- scrollUntilVisible:
    element:
      text: 'New plan'
    direction: DOWN
- tapOn:
    id: 'more-program-btn'
    rightOf: 'New plan'
- tapOn: 'Remove'
