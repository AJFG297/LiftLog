appId: com.ajfg297.liftlog
---
# Start a freeform workout
- launchApp
# A cold dev-client launch can take up to a minute to fetch the bundle from Metro
- extendedWaitUntil:
    visible: 'Workout'
    timeout: 60000
- tapOn: 'Workout'
# Text matching is case-insensitive by default, which would also match the "Freeform Workout"
# cards in the list, so `(?-i)` pins this to the button's own casing.
- tapOn: '(?-i)Freeform workout'
# A session left in progress by an earlier run has to be replaced before a fresh one starts
- runFlow:
    when:
      visible: 'Replace current workout?'
    commands:
      - tapOn: 'Replace'

# Add an exercise (defaults to "New Exercise", 3 sets x 10 reps) and leave it as-is
- tapOn: 'Add exercise'
- back

# Log the first set with one tap on its check, which starts the rest timer. The rest pill in the
# header is always there, so check it is counting down: its label reads "Rest timer, 1:29 left" while
# resting and "Rest timer, 1:30" when idle.
- tapOn:
    id: 'set-check'
- assertVisible:
    id: 'rest-pill'
    text: 'Rest timer, .* left'

# Set the logged set's weight to 7.5kg (3 x 2.5kg steps on the number pad) and hide the pad
- tapOn:
    id: 'set-weight'
- tapOn: 'Add 2.5 kg'
- tapOn: 'Add 2.5 kg'
- tapOn: 'Add 2.5 kg'
- tapOn: 'Hide keypad'

# Finish the (incomplete) session and confirm
- tapOn:
    id: 'finish-session-button'
- tapOn:
    id: 'action-ok'

# Finishing opens the summary, and a freeform workout isn't in the program yet, so a sheet over it offers
# to save the workout as a routine. This flow is not about that, so decline and leave the plan alone.
- assertVisible: 'Save Freeform Workout as a routine\?'
- tapOn: "Don't save it"
- tapOn: 'Done'

# It shows up in History with the logged weight, below the streak card and the calendar
- tapOn: 'History'
- assertVisible:
    id: 'session-summary-title'
# Summaries read "10 @ 7.5kg", and `text` is a full-string match, so anchor on the tail
- scrollUntilVisible:
    element:
      text: '.*7\.5kg'
    direction: DOWN
