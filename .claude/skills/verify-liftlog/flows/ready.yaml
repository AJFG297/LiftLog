appId: com.ajfg297.liftlog
---
# Readiness gate: ends on Home's root, clearing the first-run welcome wizard if it is up. Run after every
# `verify.sh up`; re-running it is safe wherever the app was left.
# `up`, `clear` and `seed` have just opened the app on this slot's Metro with an intent pinned to the
# package (Maestro's openLink stops on an "Open with" chooser), so only bring that instance to the front.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'Next|Get started|Home|Continue'
    timeout: 20000
    optional: true
# None of those means a page or sheet over the tabs, which hides the tab bar, or a load that stalled. A
# restart lands on Home's root and reconnects to the Metro URL the dev client remembers from `up`.
- runFlow:
    when:
      notVisible: 'Next|Get started|Home|Continue'
    commands:
      - launchApp
# First bundle of a fresh Metro can take well over a minute
- extendedWaitUntil:
    visible: 'Next|Home|Continue'
    timeout: 180000
# A fresh install of the dev client opens its developer-menu intro sheet over the app once
- runFlow:
    when:
      visible: 'This is the developer menu.*'
    commands:
      - tapOn: 'Continue'
# ...and "Continue" leaves the full dev menu open on top of the app; back closes it
- runFlow:
    when:
      visible: 'Toggle performance monitor'
    commands:
      - back
- extendedWaitUntil:
    visible: 'Next|Home'
    timeout: 30000
- repeat:
    while:
      visible: '^Next$'
    times: 5
    commands:
      - tapOn: '^Next$'
- runFlow:
    when:
      visible: 'Get started'
    commands:
      - tapOn: 'Get started'
# From another tab, the Home tab goes back to Home. Reselecting a tab doesn't pop its stack on Android, so
# a page pushed inside Home's own tab needs a back.
- repeat:
    while:
      notVisible:
        id: 'home-range'
    times: 4
    commands:
      - tapOn: 'Home'
      - waitForAnimationToEnd:
          timeout: 3000
      - runFlow:
          when:
            notVisible:
              id: 'home-range'
          commands:
            - back
# The range switch is always on Home. `Freeform workout` is not: a workout in progress hides it.
- extendedWaitUntil:
    visible:
      id: 'home-range'
    timeout: 30000
- takeScreenshot: ready
