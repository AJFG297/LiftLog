appId: com.ajfg297.liftlog
---
# Logs one Legs workout from Home's Up next card and dates it DAYS_AGO days back. FIRST 'true' types
# the starting weights; later workouts keep the weights carried over, which the first exercise's
# Add weight progression raises by 2.5 kg, so each repeat sets a personal record on it. RPE rates the
# first exercise's Set 1 ('-' for none).
- runFlow:
    file: start.yaml
    env:
      ROUTINE: 'Legs'
- runFlow:
    file: log-exercise.yaml
    env:
      NAME: 'Barbell Squat'
      SETS: 3
      WARMUP: 'true'
      D1: "${FIRST == 'true' ? '8' : '-'}"
      D2: '0'
      RPE: ${RPE}
- runFlow: next.yaml
- runFlow:
    file: log-exercise.yaml
    env:
      NAME: 'Leg Press'
      SETS: 3
      WARMUP: 'false'
      D1: "${FIRST == 'true' ? '9' : '-'}"
      D2: '0'
      RPE: '-'
- runFlow:
    file: finish.yaml
    env:
      DAYS_AGO: ${DAYS_AGO}
